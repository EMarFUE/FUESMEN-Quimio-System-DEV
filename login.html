<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar · Servicio de quimioterapia</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="contenedor">
    <div class="tarjeta-login">
      <img src="assets/FUESMEN-Logo.png" alt="FUESMEN" style="height: 50px; width: auto; margin-bottom: 20px;" />
      <div class="eyebrow">servicio de quimioterapia</div>
      <h1 style="font-size:20px; margin-bottom:24px;">Ingresar al sistema</h1>

      <div class="mensaje-error" id="mensaje-error"></div>

      <form id="form-login">
        <div class="campo">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" />
        </div>
        <div class="campo">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="boton-principal" id="boton-ingresar">Ingresar</button>
      </form>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="js/firebase-config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Si la sesión se perdió con el login abierto dentro del panel del Puesto (iframe), se sale al login completo.
    if (window.top !== window.self) window.top.location.href = window.location.href;
    const form = document.getElementById("form-login");
    const mensajeError = document.getElementById("mensaje-error");
    const botonIngresar = document.getElementById("boton-ingresar");

    // B2a: al iniciar sesión (y con una sesión ya activa) se entra directo a la agenda del día, para todos
    // los roles. La portada de módulos (index.html) queda a un clic: «Inicio» en la barra de la agenda.
    const DESTINO_INICIAL = "turnero/agenda.html";
    auth.onAuthStateChanged((user) => {
      if (user) window.location.href = DESTINO_INICIAL;
    });

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      mensajeError.style.display = "none";
      botonIngresar.disabled = true;
      botonIngresar.textContent = "Ingresando…";

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      try {
        await auth.signInWithEmailAndPassword(email, password);
        window.location.href = DESTINO_INICIAL;
      } catch (error) {
        mensajeError.textContent = traducirErrorAuth(error.code);
        mensajeError.style.display = "block";
        botonIngresar.disabled = false;
        botonIngresar.textContent = "Ingresar";
      }
    });
  </script>
</body>
</html>
