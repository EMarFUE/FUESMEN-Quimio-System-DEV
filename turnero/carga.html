<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carga de turno · Servicio de quimioterapia</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body style="visibility:hidden">
  <div class="contenedor">
    <div class="encabezado-sesion">
      <div>
        <img src="../assets/FUESMEN-Logo.png" alt="FUESMEN" style="height: 48px; width: auto; margin-bottom: 8px;" />
        <div class="breadcrumb"><a href="../index.html">Inicio</a> &gt; <a href="index.html">Turnero</a> &gt; Carga de turno</div>
        <h1 style="margin-bottom:0;margin-top:8px;">Carga de turno</h1>
      </div>
      <div style="text-align:right;">
        <div class="datos-sesion" id="datos-sesion"></div>
        <button class="boton-secundario" style="margin-top:8px;" onclick="cerrarSesion('../login.html')">Cerrar sesión</button>
      </div>
    </div>

    <div id="mensaje-general" class="mensaje-info" style="display:none;"></div>

    <div id="contenido-carga" style="display:none;">
      <!-- Etapa 5C, P4: el formulario se escribe UNA vez (js/turnero-formulario.js) y lo montan
           las dos pantallas — esta y el modal "+ Nuevo turno" de agenda.html. -->
      <div id="formulario-carga"></div>
    </div><!-- /contenido-carga -->
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/turnero-motor.js"></script>
  <script src="../js/turnero-formulario.js"></script>
  <script src="../js/turnero-carga.js"></script>
  <script>
    montarFormularioCarga("formulario-carga"); // antes de iniciarCargaTurno(), que engancha los eventos

    requireAuth(async (user, datosUsuario) => {
      const rolLabel = ROLES[datosUsuario.rol] || datosUsuario.rol;
      document.getElementById("datos-sesion").innerHTML =
        `Hola, <strong>${escaparHtml(datosUsuario.nombre || user.email)}</strong> · rol: <strong>${rolLabel}</strong>`;

      if (datosUsuario.rol !== "administrador") {
        document.getElementById("mensaje-general").className = "mensaje-info error";
        document.getElementById("mensaje-general").textContent = "Esta pantalla es exclusiva para administrador. Para cargar turnos, usá \"+ nuevo turno\" desde la agenda semanal.";
        document.getElementById("mensaje-general").style.display = "block";
        return;
      }

      document.getElementById("contenido-carga").style.display = "block";
      await iniciarCargaTurno(user, datosUsuario);
    }, "../login.html");
  </script>
</body>
</html>
